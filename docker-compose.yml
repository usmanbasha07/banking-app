version: "3.8"

services:

  app:
    image: springboot-app
    build: .
    container_name: app
    ports:
      - "8081:8081"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app