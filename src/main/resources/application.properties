# =========================================================
#  BASE CONFIGURATION
#  This file is loaded for ALL profiles.
#  Profile-specific overrides are in:
#    application-dev.properties
#    application-stage.properties
#    application-prod.properties
#
#  Set active profile via environment variable:
#    export SPRING_PROFILES_ACTIVE=dev   (or stage / prod)
# =========================================================

spring.application.name=banking-app

# Active profile is controlled entirely by environment variable.
# Default to 'dev' so developers can run the app locally without any setup.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
