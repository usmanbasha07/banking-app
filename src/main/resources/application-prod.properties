# =========================================================
#  PRODUCTION PROFILE
#  Active when: SPRING_PROFILES_ACTIVE=prod
#  DB: MySQL — credentials injected via environment variables
#  IMPORTANT: ddl-auto=validate — schema must already exist!
#             Run DB migrations (Flyway/Liquibase) before deployment.
#  Run: SPRING_PROFILES_ACTIVE=prod java -jar banking-app.jar
#       OR set env vars and run via Docker Compose
# =========================================================

# --- Server ---
server.port=${SERVER_PORT:8082}

# --- MySQL Database (prod) ---
# ALL credentials come from environment variables — NEVER hardcode here
spring.datasource.platform=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME}?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Connection Pool (HikariCP — tuned for prod) ---
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate ---
# validate = safest for prod; Hibernate checks schema but never alters it
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false

# --- Logging (minimal in prod — reduces noise and prevents data leaks in logs) ---
logging.level.root=${LOG_LEVEL:WARN}
logging.level.com.ub.banking=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.SQL=WARN

# --- Actuator (expose only health endpoint in prod) ---
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
