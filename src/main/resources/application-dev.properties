# =========================================================
#  DEVELOPMENT PROFILE
#  Active when: SPRING_PROFILES_ACTIVE=dev
#  DB: H2 in-memory (no MySQL required locally)
#  Run: mvn spring-boot:run -Dspring-boot.run.profiles=dev
# =========================================================

# --- Server ---
server.port=${SERVER_PORT:8081}

# --- H2 In-Memory Database (dev only) ---
spring.datasource.url=jdbc:h2:mem:banking_dev_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.platform=h2

# --- H2 Console (accessible at http://localhost:8080/h2-console) ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:create-drop}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# --- Logging ---
logging.level.root=${LOG_LEVEL:DEBUG}
logging.level.com.ub.banking=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
