# =========================================================
#  STAGE PROFILE
#  Active when: SPRING_PROFILES_ACTIVE=stage
#  DB: MySQL — credentials injected via environment variables
#  Run: SPRING_PROFILES_ACTIVE=stage java -jar banking-app.jar
#       OR set env vars and run via Docker Compose
# =========================================================

# --- Server ---
server.port=${SERVER_PORT:8081}

# --- MySQL Database (stage) ---
# NEVER hardcode credentials here — always use env vars
spring.datasource.platform=mysql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:banking_stage_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# --- Connection Pool (HikariCP defaults) ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=true

# --- Logging ---
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.ub.banking=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
